version: 2
updates:
  # Site dependencies (Astro, Fontsource, wrangler, …)
  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (the native compiler) is not yet supported by @astrojs/check
      # (peer: ^5 || ^6). Stay on TS 5.x until the Astro tooling catches up, then
      # opt in deliberately. Without this, Dependabot re-breaks `npm ci` in CI.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Email fan-out Worker dependencies
  - package-ecosystem: "npm"
    directory: "/workers/email-router"
    schedule:
      interval: "weekly"

  # Keep the SHA-pinned GitHub Actions current (Dependabot bumps the pins)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
