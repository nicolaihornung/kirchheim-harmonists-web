name: CI

# Build + type-check the site on every pull request to main. This is the
# required status check for branch protection: it catches build/install
# breakage (e.g. an incompatible dependency bump) on the PR, before it can
# reach main. Deployment is a separate workflow (deploy.yml, on push to main).
#
# No paths filter on purpose: a required check that is skipped on some paths
# blocks the PR from merging (the check never reports), so we always run it.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Type-check
        run: npm run check
        working-directory: site

      - name: Build
        run: npm run build
        working-directory: site

  email-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/email-router/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: workers/email-router

      - name: Unit tests
        run: npm test
        working-directory: workers/email-router
