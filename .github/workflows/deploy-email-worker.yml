name: Deploy email router

# Deploys the info@ fan-out Email Worker on every push to main that touches it.
# Terraform/infra is NOT run here (infra is applied manually with a reviewed plan —
# see infra/README.md). The Worker must exist (deployed here) before the Terraform
# email routing rule that targets it by name is applied — see infra/email.tf.

on:
  push:
    branches: [main]
    paths:
      - 'workers/email-router/**'
      - '.github/workflows/deploy-email-worker.yml'
  workflow_dispatch:

concurrency:
  group: deploy-email-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/email-router/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: workers/email-router

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/email-router
          command: deploy
